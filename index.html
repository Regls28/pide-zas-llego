<style>
  .zas-portada {
    box-sizing: border-box;
    min-height: 100svh;
    display: grid;
    place-items: center;
    padding: 32px 20px;
    color: #fff8ef;
    background: #211711;
    font-family: system-ui, sans-serif;
  }

  .zas-tarjeta {
    width: min(100%, 520px);
    overflow: hidden;
    border: 1px solid #604331;
    border-radius: 24px;
    background: #302018;
  }

  .zas-foto {
    display: block;
    width: 100%;
    aspect-ratio: 16 / 10;
    object-fit: cover;
  }

  .zas-texto {
    padding: clamp(24px, 6vw, 40px);
  }

  .zas-marca {
    margin: 0 0 12px;
    color: #ff9a4d;
    font-weight: 800;
  }

  .zas-texto h1 {
    margin: 0 0 16px;
    color: #fff8ef;
    font-size: clamp(2.4rem, 8vw, 4rem);
    line-height: 1;
  }

  .zas-mensaje {
    margin: 0;
    color: #eed9c9;
    font-size: 1.05rem;
    line-height: 1.6;
  }
</style>

<main class="zas-portada">
  <section class="zas-tarjeta" aria-labelledby="zas-titulo">
    <!-- Cuando subas la foto, quita esta línea de comentario y la de cierre.
    <img
      class="zas-foto"
      src="./images/disfrutando-pizza.jpg"
      alt="Una persona sonriendo mientras disfruta una rebanada de pizza"
    >
    -->
    <div class="zas-texto">
      <p class="zas-marca">Pide. ZAS. Llegó.</p>
      <h1 id="zas-titulo">Hoy se antoja pizza.</h1>
      <p class="zas-mensaje">
        Abre el enlace o escanea el código QR de tu pizzería favorita
        para ver su menú y hacer tu pedido.
      </p>
    </div>
  </section>
</main>
